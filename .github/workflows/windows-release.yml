name: Windows setup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and build dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements-build.txt
      - name: Build Windows application
        run: pyinstaller --noconfirm DeepTracker.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer\DeepTracker.iss
      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepTracker-Windows-Setup
          path: dist-installer/DeepTrackerSetup.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/DeepTrackerSetup.exe
